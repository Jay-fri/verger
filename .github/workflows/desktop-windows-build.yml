# Builds the Windows installer for apps/desktop (the Electron NDI bridge).
#
# This has to run on a real Windows runner, not macOS/Linux CI: grandiose's
# native NDI addon has no prebuilt binaries (see apps/desktop/README.md) and
# compiles per-platform via node-gyp during `pnpm install`. A macOS-compiled
# .node file can't be packaged into a Windows .exe — there's no
# cross-compilation path here, only a real per-platform build.
name: Desktop Windows build

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch: {}

jobs:
  build-windows:
    # Not windows-latest, deliberately: that image now ships VS 2026 (major
    # version 18), which @electron/node-gyp's pinned fork doesn't recognize
    # at all — a second, separate problem from the ERR_CHILD_PROCESS_
    # STDIO_MAXBUFFER crash it also hits there (see git history/README for
    # both). windows-2022 still ships VS 2022, which the fork does
    # recognize, and — unverified but the working theory — a smaller VS
    # component set whose query output might stay under node-gyp's
    # unconfigurable 1MB execFile buffer where windows-latest's doesn't.
    runs-on: windows-2022
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No explicit version here — reads the exact pnpm version from the
      # repo's own package.json "packageManager" field instead, so CI can
      # never drift from what's actually used locally. That's what broke
      # this originally: an unpinned `version: 11` resolved to the latest
      # 11.x (11.23.0) rather than the 11.5.1 used everywhere else, and it
      # turns out pnpm 11 as a whole line needs Node >=22.13 — the 20.x
      # pinned below was simply wrong regardless of which 11.x resolved.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # node-gyp's own Visual Studio auto-detection is broken on
      # windows-latest runners specifically: it queries installed VS
      # components via PowerShell with no maxBuffer override (defaults to
      # Node's 1MB limit), and windows-latest ships enough VS workloads that
      # the query's output exceeds that and crashes with
      # ERR_CHILD_PROCESS_STDIO_MAXBUFFER — which node-gyp then
      # mis-reports as "Could not find any Visual Studio installation to
      # use" (confirmed by an actual failed run here: it HAD found VS and
      # resolved MSBuild.exe's path just before the crash). Rather than
      # hardcode this runner generation's VS path (which GitHub updates
      # over time), this action finds whatever VS is actually installed and
      # exports VCINSTALLDIR — set, node-gyp skips its own buggy
      # PowerShell-based detection entirely (see node-gyp's
      # lib/find-visualstudio.js).
      - uses: ilammy/msvc-dev-cmd@v1

      # Installs the whole workspace (apps/desktop needs its monorepo
      # siblings resolvable), compiles grandiose's native addon for Windows,
      # then electron-rebuild (this package's postinstall script) recompiles
      # it specifically against Electron's Node ABI.
      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build Windows installer
        run: pnpm dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: verger-desktop-windows-installer
          path: apps/desktop/release/*.exe
          if-no-files-found: error
